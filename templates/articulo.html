<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{titulo}} | Blog de EduEurope</title>
<meta name="description" content="{{descripcion}}">
<meta property="og:title" content="{{titulo}}">
<meta property="og:description" content="{{descripcion}}">
<meta property="og:type" content="article">
<meta name="theme-color" content="#1d4ed8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script type="module" src="/src/main.js"></script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{titulo}}",
  "description": "{{descripcion}}",
  "datePublished": "{{fechaIso}}",
  "author": { "@type": "Person", "name": "{{autor}}" },
  "publisher": { "@type": "Organization", "name": "EduEurope" }
}
</script>
</head>
<body>

<!-- include:nav -->

<main id="contenido">

<article class="post">
    <header class="page-hero">
        <div class="wrap wrap-narrow">
            <nav class="breadcrumb" aria-label="Estás aquí">
                <a href="/">Inicio</a> <span aria-hidden="true">/</span>
                <a href="/blog/">Blog</a> <span aria-hidden="true">/</span>
                <span aria-current="page">{{titulo}}</span>
            </nav>
            <p class="eyebrow">{{categoria}}</p>
            <h1>{{titulo}}</h1>
            <p class="lead">{{descripcion}}</p>
            <p class="post-meta">Por <strong>{{autor}}</strong> · <time datetime="{{fechaIso}}">{{fecha}}</time> · {{lectura}} min de lectura</p>
        </div>
    </header>

    <div class="section page-section">
        <div class="wrap wrap-narrow">
            {{imagen}}
            <div class="prose">
                {{contenido}}
            </div>

            <div class="post-cta">
                <p><strong>¿Quieres llevar esto a tu aula?</strong> Consulta nuestros cursos para docentes, online y presenciales.</p>
                <a class="btn btn-secondary" href="/#programas">Ver los cursos</a>
            </div>

            {{otros}}
        </div>
    </div>
</article>

</main>

<!-- include:footer -->

</body>
</html>
